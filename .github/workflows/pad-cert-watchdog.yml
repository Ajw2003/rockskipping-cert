name: Keep the pad certificate watch going

# Restarts pad-cert-watch.yml's chain if it ever stops. Wakes every 5 minutes;
# if no watchdog loop is running it starts one, which polls for up to about
# 5.5 hours and hands off to its own successor before GitHub's 6-hour job
# limit. A wakeup that finds a loop already running exits in seconds, so the
# frequent schedule is cheap even though GitHub doesn't fire it reliably.
# Adapted from Ajw2003/CannaScraper's scrape-watchdog.yml at c4148a8.

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      successor_of:
        description: Run id of the watchdog run that dispatched this one (internal; leave blank for a manual run).
        type: string
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      SUCCESSOR_OF: ${{ github.event.inputs.successor_of }}
    steps:
      - uses: actions/checkout@v4

      - run: ci/watchdog.sh
